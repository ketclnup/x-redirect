<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000000">
  <title>Open X</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      text-align: center;
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      margin: 0 0 24px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      margin: 12px 0;
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      border: 1px solid #536471;
      color: #fff;
    }

    .small {
      font-size: 12px;
      color: #71767b;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">𝕏</div>

    <h1>Xで @ketclnup を開く</h1>

    <p id="status">
      Xアプリを起動しています。<br>
      自動で開かない場合は下のボタンを押してください。
    </p>

    <a
      class="btn primary"
      id="openApp"
      href="twitter://user?screen_name=ketclnup">
      Xアプリで開く
    </a>

    <a
      class="btn secondary"
      href="https://x.com/ketclnup">
      Web版Xで開く
    </a>

    <div class="small">@ketclnup</div>

  </main>

  <script>
    const appUrl = "twitter://user?screen_name=ketclnup";

    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.href = appUrl;
      }, 150);

      setTimeout(() => {
        document.getElementById("status").innerHTML =
          '自動でアプリが開かない場合は<br>「Xアプリで開く」をタップしてください。';
      }, 1800);
    });
  </script>

</body>
</html>
